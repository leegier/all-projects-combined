<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="{{META_DESCRIPTION}}">
  <title>{{TITLE}}</title>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Article",
    "headline": "{{TITLE}}",
    "datePublished": "{{DATE_PUBLISHED}}",
    "dateModified": "{{DATE_MODIFIED}}",
    "author": {
      "@type": "Person",
      "name": "{{AUTHOR_NAME}}"
    }
  }
  </script>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "FAQPage",
    "mainEntity": [
      {{FAQ_ITEMS}}
    ]
  }
  </script>
  <style>
    :root { --primary: #1a1a2e; --accent: #e94560; --bg: #fafafa; --text: #222; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; line-height: 1.7; color: var(--text); background: var(--bg); max-width: 800px; margin: 0 auto; padding: 2rem 1rem; }
    h1 { font-size: 2rem; margin-bottom: 1rem; color: var(--primary); }
    h2 { font-size: 1.5rem; margin: 2rem 0 0.5rem; color: var(--primary); border-bottom: 2px solid var(--accent); padding-bottom: 0.3rem; }
    h3 { font-size: 1.2rem; margin: 1.5rem 0 0.5rem; }
    p { margin-bottom: 1rem; }
    img { max-width: 100%; height: auto; border-radius: 8px; margin: 1rem 0; }
    table { width: 100%; border-collapse: collapse; margin: 1.5rem 0; }
    th, td { border: 1px solid #ddd; padding: 0.75rem; text-align: left; }
    th { background: var(--primary); color: #fff; }
    tr:nth-child(even) { background: #f5f5f5; }
    a { color: var(--accent); }
    .author-box { background: #f0f0f0; padding: 1.5rem; border-radius: 8px; margin-top: 3rem; display: flex; gap: 1rem; align-items: center; }
    .author-box img { width: 80px; height: 80px; border-radius: 50%; }
    .faq-section { background: #f9f9f9; padding: 1.5rem; border-radius: 8px; margin: 2rem 0; }
    .faq-section h3 { margin-top: 1rem; }
    .toc { background: #f0f4f8; padding: 1rem 1.5rem; border-radius: 8px; margin: 1rem 0 2rem; }
    .toc ul { list-style: none; padding-left: 1rem; }
    .toc a { text-decoration: none; }
    .affiliate-disclosure { font-size: 0.85rem; color: #666; font-style: italic; margin-bottom: 2rem; }
  </style>
</head>
<body>

<p class="affiliate-disclosure">Disclosure: This article contains affiliate links. If you make a purchase through these links, we may earn a small commission at no extra cost to you.</p>

<h1>{{TITLE}}</h1>

<div class="toc">
  <strong>Table of Contents</strong>
  {{TOC}}
</div>

{{ARTICLE_BODY}}

<div class="faq-section">
  <h2>Frequently Asked Questions</h2>
  {{FAQ_HTML}}
</div>

<div class="author-box">
  <img src="/images/author.jpg" alt="{{AUTHOR_NAME}}" loading="lazy">
  <div>
    <strong>About the Author</strong>
    <p>{{AUTHOR_BIO}}</p>
  </div>
</div>

</body>
</html>
