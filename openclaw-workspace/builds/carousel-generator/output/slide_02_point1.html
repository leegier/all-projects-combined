<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Slide 2</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    width: 1080px;
    height: 1080px;
    background: linear-gradient(160deg, #1a1a2e 0%, #16213e 100%);
    color: #ffffff;
    font-family: 'Inter', 'Segoe UI', Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  /* subtle grid overlay */
  body::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(233,69,96,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(233,69,96,0.04) 1px, transparent 1px);
    background-size: 60px 60px;
    pointer-events: none;
  }

  .slide {
    width: 960px;
    min-height: 960px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 60px;
    position: relative;
    z-index: 1;
    text-align: center;
  }

  .accent { color: #e94560; }

  .tag {
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #e94560;
    margin-bottom: 24px;
    opacity: 0.9;
  }

  .headline {
    font-size: 52px;
    font-weight: 900;
    line-height: 1.1;
    letter-spacing: -1px;
    margin-bottom: 24px;
  }

  .subline {
    font-size: 22px;
    font-weight: 400;
    color: rgba(255,255,255,0.65);
    line-height: 1.5;
    max-width: 720px;
  }

  .divider {
    width: 60px;
    height: 4px;
    background: #e94560;
    border-radius: 2px;
    margin: 32px auto;
  }

  .slide-num {
    position: absolute;
    bottom: 24px;
    right: 40px;
    font-size: 13px;
    color: rgba(255,255,255,0.3);
    font-weight: 600;
    letter-spacing: 1px;
  }

  .handle {
    position: absolute;
    bottom: 24px;
    left: 40px;
    font-size: 14px;
    color: rgba(255,255,255,0.35);
    font-weight: 600;
  }

  /* Point slide */
  .point-number {
    font-size: 80px;
    font-weight: 900;
    color: #e94560;
    line-height: 1;
    margin-bottom: 16px;
    opacity: 0.9;
  }

  .point-title {
    font-size: 46px;
    font-weight: 800;
    line-height: 1.2;
    margin-bottom: 20px;
    letter-spacing: -0.5px;
  }

  .point-body {
    font-size: 22px;
    font-weight: 400;
    color: rgba(255,255,255,0.70);
    line-height: 1.6;
    max-width: 720px;
  }

  /* CTA slide */
  .cta-box {
    background: rgba(233,69,96,0.12);
    border: 2px solid rgba(233,69,96,0.4);
    border-radius: 20px;
    padding: 48px 64px;
    text-align: center;
    max-width: 800px;
  }

  .cta-headline {
    font-size: 58px;
    font-weight: 900;
    line-height: 1.1;
    margin-bottom: 20px;
    letter-spacing: -1px;
  }

  .cta-sub {
    font-size: 22px;
    color: rgba(255,255,255,0.65);
    margin-bottom: 36px;
    line-height: 1.5;
  }

  .cta-handle {
    font-size: 32px;
    font-weight: 800;
    color: #e94560;
    letter-spacing: 1px;
  }

  .follow-pill {
    display: inline-block;
    background: #e94560;
    color: #fff;
    font-size: 18px;
    font-weight: 700;
    padding: 14px 36px;
    border-radius: 40px;
    margin-top: 24px;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
</style>
</head>
<body>
<div class="slide">
    <div class="point-number">01</div>
  <div class="point-title">Automated Freelance Delivery</div>
  <div class="divider"></div>
  <div class="point-body">AI agents scan job boards, write proposals, and deliver finished work — design, copy, code — with zero manual input. You collect the payment.</div>
  <div class="handle">@leegier</div>
  <div class="slide-num">2/7</div>
</div>
</body>
</html>
