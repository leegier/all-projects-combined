<!DOCTYPE html>
<html>
<head>
    <title>Knowledge Graph Viewer</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }
        #container {
            display: flex;
            height: 100vh;
        }
        #sidebar {
            width: 300px;
            padding: 20px;
            background: #f5f5f5;
            border-right: 1px solid #ddd;
        }
        #graph {
            flex-grow: 1;
            background: white;
            position: relative;
        }
        .search-box {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
            box-sizing: border-box;
        }
        .node circle {
            fill: #69b3a2;
            stroke: #fff;
            stroke-width: 2px;
        }
        .node text {
            font-size: 12px;
        }
        .link {
            stroke: #999;
            stroke-opacity: 0.6;
            stroke-width: 1px;
        }
        .selected {
            stroke: red !important;
            stroke-width: 3px !important;
        }
        .neighbor {
            stroke: orange !important;
            stroke-width: 2px !important;
        }
        #drop-zone {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 20px;
            border: 2px dashed #ccc;
            border-radius: 4px;
            text-align: center;
            background: rgba(255, 255, 255, 0.9);
            z-index: 1000;
        }
        #drop-zone.dragover {
            border-color: #69b3a2;
            background: rgba(105, 179, 162, 0.1);
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="sidebar">
            <input type="text" id="search" class="search-box" placeholder="Search nodes...">
            <div id="details"></div>
        </div>
        <div id="graph">
            <div id="drop-zone">
                Drag and drop your catalogue.json file here<br>
                or click to select a file
            </div>
            <input type="file" id="file-input" style="display: none" accept=".json">
        </div>
    </div>

    <script>
        // Initialize the graph visualization
        const width = window.innerWidth - 300;  // Subtract sidebar width
        const height = window.innerHeight;

        const svg = d3.select("#graph")
            .append("svg")
            .attr("width", width)
            .attr("height", height);

        const g = svg.append("g");

        // Add zoom behavior
        const zoom = d3.zoom()
            .scaleExtent([0.1, 4])
            .on("zoom", (event) => {
                g.attr("transform", event.transform);
            });

        svg.call(zoom);

        // Create the force simulation
        const simulation = d3.forceSimulation()
            .force("link", d3.forceLink().id(d => d.id).distance(200))
            .force("charge", d3.forceManyBody().strength(-2000))
            .force("center", d3.forceCenter(width / 2, height / 2))
            .force("collision", d3.forceCollide().radius(50))
            .force("x", d3.forceX(width / 2).strength(0.1))
            .force("y", d3.forceY(height / 2).strength(0.1))
            .alphaDecay(0.02);  // Faster initial settling

        // Set up drag and drop handlers
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        
        // Add click handler for the drop zone
        dropZone.addEventListener('click', () => {
            fileInput.click();
        });

        // Handle file selection
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file && file.name === 'catalogue.json') {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const data = JSON.parse(e.target.result);
                    processData(data);
                };
                reader.readAsText(file);
            } else {
                alert('Please select a valid catalogue.json file');
            }
        });
        
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }

        ['dragenter', 'dragover'].forEach(eventName => {
            dropZone.addEventListener(eventName, highlight, false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, unhighlight, false);
        });

        function highlight(e) {
            dropZone.classList.add('dragover');
        }

        function unhighlight(e) {
            dropZone.classList.remove('dragover');
        }

        function processData(data) {
            // Hide the drop zone
            dropZone.style.display = 'none';
            
            const nodes = new Map(); // Use a Map to track unique nodes
            const links = [];
            
            // First pass: Create all nodes
            Object.entries(data.files).forEach(([path, info]) => {
                const nodeId = info.asset_path || info.file_path;
                nodes.set(nodeId, {
                    id: nodeId,
                    type: info.asset_path ? 'asset' : 'file'
                });

                // Add nodes for dependencies
                info.dependencies.forEach(dep => {
                    if (!nodes.has(dep)) {
                        nodes.set(dep, {
                            id: dep,
                            type: 'file' // Default to file type for dependencies
                        });
                    }
                });

                // Add nodes for referencers
                info.referencers.forEach(ref => {
                    if (!nodes.has(ref)) {
                        nodes.set(ref, {
                            id: ref,
                            type: 'file' // Default to file type for referencers
                        });
                    }
                });
            });

            // Second pass: Create links
            Object.entries(data.files).forEach(([path, info]) => {
                const nodeId = info.asset_path || info.file_path;

                // Create links for dependencies
                info.dependencies.forEach(dep => {
                    links.push({
                        source: nodeId,
                        target: dep,
                        type: 'dependency'
                    });
                });

                // Create links for referencers
                info.referencers.forEach(ref => {
                    links.push({
                        source: ref,
                        target: nodeId,
                        type: 'reference'
                    });
                });
            });

            // Convert Map to array for D3
            const nodesArray = Array.from(nodes.values());

            // Update the simulation with the new data
            simulation.nodes(nodesArray);
            simulation.force("link").links(links);

            // Create the graph elements
            const link = g.append("g")
                .selectAll("line")
                .data(links)
                .join("line")
                .attr("class", "link")
                .attr("stroke", d => d.type === 'dependency' ? "#69b3a2" : "#ff7f0e")
                .attr("stroke-width", 1);

            const node = g.append("g")
                .selectAll(".node")
                .data(nodesArray)
                .join("g")
                .attr("class", "node")
                .call(d3.drag()
                    .on("start", dragstarted)
                    .on("drag", dragged)
                    .on("end", dragended));

            node.append("circle")
                .attr("r", 8)
                .attr("fill", d => d.type === 'asset' ? "#69b3a2" : "#404040");

            node.append("text")
                .attr("dx", 15)
                .attr("dy", ".35em")
                .text(d => d.id.split('/').pop())
                .style("pointer-events", "none");  // Prevent text from interfering with node dragging

            // Update positions on each tick
            simulation.on("tick", () => {
                link
                    .attr("x1", d => d.source.x)
                    .attr("y1", d => d.source.y)
                    .attr("x2", d => d.target.x)
                    .attr("y2", d => d.target.y);

                node
                    .attr("transform", d => `translate(${d.x},${d.y})`);
            });

            // Start with a higher alpha to spread nodes out initially
            simulation.alpha(1).restart();

            // Implement search functionality
            const searchBox = document.getElementById("search");
            searchBox.addEventListener("input", function() {
                const searchTerm = this.value.toLowerCase();
                
                node.each(function(d) {
                    const element = d3.select(this);
                    const isMatch = d.id.toLowerCase().includes(searchTerm);
                    
                    element.select("circle")
                        .classed("selected", isMatch && searchTerm.length > 0);
                    
                    if (isMatch && searchTerm.length > 0) {
                        highlightNeighbors(d, links, node);
                    }
                });

                if (searchTerm.length === 0) {
                    node.select("circle").classed("selected", false).classed("neighbor", false);
                }
            });
        }

        function dragstarted(event) {
            if (!event.active) simulation.alphaTarget(0.3).restart();
            event.subject.fx = event.subject.x;
            event.subject.fy = event.subject.y;
        }

        function dragged(event) {
            event.subject.fx = event.x;
            event.subject.fy = event.y;
        }

        function dragended(event) {
            if (!event.active) simulation.alphaTarget(0);
            event.subject.fx = null;
            event.subject.fy = null;
        }

        function highlightNeighbors(d, links, node) {
            const neighbors = new Set();
            links.forEach(link => {
                if (link.source.id === d.id) neighbors.add(link.target.id);
                if (link.target.id === d.id) neighbors.add(link.source.id);
            });

            node.select("circle").classed("neighbor", n => 
                n.id !== d.id && neighbors.has(n.id)
            );
        }
    </script>
</body>
</html>
